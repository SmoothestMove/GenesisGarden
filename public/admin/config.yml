backend:
  name: github
  repo: SmoothestMove/GenesisGarden
  branch: main
  base_url: /api
  auth_endpoint: auth

# Runs locally with `npm run cms` (decap-server), reading/writing the
# working tree directly instead of going through GitHub OAuth.
local_backend: true

media_folder: "public/images"
public_folder: "/images"

publish_mode: simple

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "src/content/site.json"
        label: "Site Settings"
        name: "site"
        description: "Organization info shown across the whole site (footer, phone/call links, etc.)"
        fields:
          - { label: "Organization Name", name: "orgName", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Phone (display)", name: "phone", widget: "string", hint: "e.g. 309-326-3075" }
          - { label: "Phone Link", name: "phoneHref", widget: "string", hint: "e.g. tel:3093263075 (no spaces or dashes)" }
          - { label: "Email", name: "email", widget: "string" }
          - label: "Address"
            name: "address"
            widget: "object"
            fields:
              - { label: "Street", name: "street", widget: "string" }
              - { label: "City, State ZIP", name: "cityStateZip", widget: "string" }
          - label: "Social Links"
            name: "social"
            widget: "object"
            fields:
              - { label: "Facebook URL", name: "facebook", widget: "string" }
          - { label: "Year Founded", name: "foundedYear", widget: "number", value_type: "int" }

      - file: "src/content/home.json"
        label: "Home Page"
        name: "home"
        fields:
          - label: "SEO"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Page Title", name: "title", widget: "string" }
              - { label: "Page Description", name: "description", widget: "text" }
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Background Image", name: "backgroundImage", widget: "image" }
              - { label: "Badge Text", name: "badge", widget: "string" }
              - { label: "Title (line 1)", name: "titleLine1", widget: "string" }
              - { label: "Title (accent line)", name: "titleAccent", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - { label: "Primary Button Label", name: "primaryButtonLabel", widget: "string" }
              - { label: "Primary Button Link", name: "primaryButtonTo", widget: "string", hint: "internal page path, e.g. /housing-services" }
          - label: "Mission Strip (3 cards)"
            name: "missionStrip"
            widget: "list"
            fields:
              - label: "Icon"
                name: "icon"
                widget: "select"
                options: ["house", "people", "shield"]
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "string" }
          - label: "Things to Know"
            name: "thingsToKnow"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro Text", name: "intro", widget: "text" }
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Number", name: "number", widget: "string", hint: "e.g. 01" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text" }
          - label: "Impact Section"
            name: "impact"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string" }
              - label: "Stats (3 cards)"
                name: "stats"
                widget: "list"
                fields:
                  - { label: "Number (leave blank for Years of Service, calculated automatically)", name: "end", widget: "number", value_type: "int", required: false }
                  - { label: "Suffix", name: "suffix", widget: "string", required: false, hint: "e.g. + or blank" }
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Detail Text", name: "detail", widget: "string" }
          - label: "Call-to-Action Section"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Background Image", name: "backgroundImage", widget: "image" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Button Label", name: "secondaryButtonLabel", widget: "string" }
              - { label: "Button Link", name: "secondaryButtonTo", widget: "string" }

      - file: "src/content/housing-services.json"
        label: "Housing Services Page"
        name: "housing-services"
        fields:
          - label: "SEO"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Page Title", name: "title", widget: "string" }
              - { label: "Page Description", name: "description", widget: "text" }
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Background Image", name: "backgroundImage", widget: "image" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - label: "Intro Section"
            name: "intro"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Paragraph 1", name: "paragraph1", widget: "text" }
              - { label: "Highlighted Line", name: "highlight", widget: "string" }
              - { label: "Paragraph 2", name: "paragraph2", widget: "text" }
          - label: "Services Section"
            name: "services"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string" }
              - label: "Service Cards"
                name: "items"
                widget: "list"
                fields:
                  - label: "Icon"
                    name: "icon"
                    widget: "select"
                    options: ["exchange", "shield", "house", "target", "heart", "calendar"]
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
          - label: "Eligibility Section"
            name: "eligibility"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro Text", name: "intro", widget: "string" }
              - label: "Eligible Groups"
                name: "items"
                widget: "list"
                field: { label: "Item", name: "item", widget: "string" }
          - label: "Other Activities Card"
            name: "otherActivities"
            widget: "object"
            fields:
              - { label: "Section Heading", name: "heading", widget: "string" }
              - label: "Icon"
                name: "icon"
                widget: "select"
                options: ["exchange", "shield", "house", "target", "heart", "calendar"]
              - { label: "Card Title", name: "title", widget: "string" }
              - { label: "Card Text", name: "text", widget: "text" }
              - { label: "Link Label", name: "linkLabel", widget: "string" }
              - { label: "Link Target", name: "linkTo", widget: "string", hint: "internal page path, e.g. /summer-meals" }
          - label: "Call-to-Action Section"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Button Label", name: "secondaryButtonLabel", widget: "string" }
              - { label: "Button Link", name: "secondaryButtonTo", widget: "string" }
